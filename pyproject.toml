[project]
name = "repolore"
version = "0.1.0"
description = "RAG over your own engineering history on GitHub, with a CLI and an MCP server."
readme = "README.md"
authors = [
    { name = "ryckakas", email = "ryckakas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0,<6.2",
    "sqlite-vec>=0.1.9,<0.2",
    "torch>=2.14.1",
    "typer>=0.27.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
repolore = "repolore.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bonsai-lint>=0.5.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = ["live: calls real external APIs (GitHub, Voyage); run with -m live"]

[tool.coverage.run]
source = ["repolore"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
