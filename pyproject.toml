[project]
name = "repolore"
version = "0.1.0"
description = "RAG over your own engineering history on GitHub, with a CLI and an MCP server."
readme = "README.md"
authors = [
    { name = "ryckakas", email = "ryckakas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.13.5",
    "typer>=0.27.3",
]

[project.scripts]
repolore = "repolore.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live", "--strict-markers"]
markers = ["live: calls real external APIs (GitHub, Voyage, Claude); run with -m live"]

[tool.coverage.run]
source = ["repolore"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
